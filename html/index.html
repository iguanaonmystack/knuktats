<!DOCTYPE HTML>

<html>
<head>
    <script type="text/javascript">
        var timer_id = null;
        var punch = new Audio('streetfighter-punch.wav');

        var hide_tats = function(text) {
            timer_id = null;
            var maindiv = document.getElementById('main');
            maindiv.replaceChildren();
        };

        var show_tats = function(text) {
            var maindiv = document.getElementById('main');

            var img = document.createElement('img');
            img.src = '/knux?t=' + encodeURI(text);
            img.style.width = '100%';
            maindiv.replaceChildren(img);
            if (timer_id != null) {
                window.clearTimeout(timer_id);
            }
            timer_id = window.setTimeout(hide_tats, 3000);
            punch.play();
        };

        var hide_button = function(text) {
            timer_id = null;
            var maindiv = document.getElementById('main');
            maindiv.replaceChildren();
        };

        var show_button = function(text) {
            var maindiv = document.getElementById('main');

            var p = document.createElement('p');
            p.innerText = text;
            p.style.textAlign = 'center';
            p.style.fontFamily = 'sans';
            p.style.color = '#DDD';
            p.style.fontSize = '400%';
            maindiv.replaceChildren(p);
            if (timer_id != null) {
                window.clearTimeout(timer_id);
            }
            timer_id = window.setTimeout(hide_button, 3000);
        };

        var dungeon_master = function(text) {
            var maindiv = document.getElementById('main');
            
            var audio = new Audio('/dungeonsfx/' + text);
            audio.addEventListener("canplaythrough", (event) => {
                /* the audio is now playable; play it if permissions allow */
                audio.play();
            });
        };

        var websocket_func = function() {
            if ("WebSocket" in window) {
                // Let us open a web socket
                var ws = new WebSocket("ws://localhost:9000/echo1");
                 
                ws.onopen = function() {
                   
                    // Web Socket is connected, send data using send()
                    msg = "message to send";
                    console.log("> " + msg);
                    ws.send(msg);
                };
                 
                ws.onmessage = function (evt) { 
                    var received_msg = evt.data;
                    console.log("< " + received_msg);
                    var prefix = "KNUK TATS: ";
                    if (received_msg.startsWith(prefix)) {
                        var text = received_msg.substring(prefix.length);
                        return show_tats(text);
                    }
                    prefix = "BUTTON: ";
                    if (received_msg.startsWith(prefix)) {
                        var text = received_msg.substring(prefix.length);
                        return show_button(text);
                    }
                    prefix = "DUNGEON MASTER: ";
                    if (received_msg.startsWith(prefix)) {
                        var text = received_msg.substring(prefix.length);
                        return dungeon_master(text);
                    }
                };
                 
                ws.onclose = function() { 
                    console.log("Connection closed");
                };
            } else {
                // The browser doesn't support WebSocket
                console.log("No websocket support");
            }
        };

        window.onload = (event) => {
            console.log('page is fully loaded');
            websocket_func()
        };
    </script>
    <style>
        html, body {
            margin:0px;
            height:100%;
        }

        #main {
            display: flex;
            justify-content: center;
            align-content: center;
            flex-direction: column;
            position: absolute;
            top: 0px;
            right: 0px;
            bottom: 0px;
            left: 0px;
        }
    </style>
</head>
<body>
    <div id="main"></div>
</body>
</html>
